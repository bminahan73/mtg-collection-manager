steps:
  - name: Start MTG Collection Manager
    description: Spin up backend and client services using Docker
    run: docker compose up --build
    env:
      - key: COMPOSE_PROJECT_NAME
        value: mtg-collection
    cwd: .

instructions: |
  ## MTG Collection Manager

  ### Quick Start
  Click the play button above to start the development environment.

  ### Services
  - **Frontend (Vite)**: http://localhost:5173
  - **Backend (Express)**: http://localhost:3000

  ### Features
  - React with MTG card search filters
  - Color, type, rarity, and mana cost filters
  - Scryfall API integration
  - Local collection storage

  ### Troubleshooting
  - See DOCKER_DEV.md for detailed documentation
  - Use `make` commands for common tasks
  - Check logs with `docker-compose logs -f`

tips:
  - Make sure Docker is running before starting
  - Hot-reload is enabled—edit code and see changes instantly
  - Use Ctrl+C to stop services, then run again to restart
